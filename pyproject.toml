[project]
name = "invoice-reconciliation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "pypdf>=6,<7", "openpyxl>=3.1,<4", "Pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<5", "pypdfium2>=4,<6"]

[tool.pytest.ini_options]
pythonpath = ["core"]
testpaths = ["core/tests"]

[tool.uv]
package = false
