<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报销对账台</title>
<style>
  :root { --ink: #1f2a26; --muted: #5b6b64; --line: #d3ded9; --accent: #0f766e; --warn: #b45309; --bg: #f6f8f7; }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .muted { color: var(--muted); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .code { font: 600 36px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 6px; color: var(--accent); }
  pre { white-space: pre-wrap; margin: 0; font: inherit; }
  label { display: block; margin: 6px 0 2px; color: var(--muted); font-size: 13px; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button { margin: 8px 8px 0 0; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  .reason { color: var(--warn); }
  .note { border-left: 3px solid var(--line); padding-left: 8px; margin-top: 6px; }
  img.original { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; }
  #message { min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>报销对账台</h1>
  <div id="status" class="muted">正在连接…</div>
  <div id="message" class="reason"></div>
  <div id="content"></div>
</main>
<script>
"use strict";
const batch = location.pathname.split("/").filter(Boolean).pop();
const api = (path) => `/desk/api/b/${encodeURIComponent(batch)}/${path}`;
const REASONS = {
  EVIDENCE_MISSING: "没有找到对应的支付记录", OVER_LIMIT: "金额超过政策标准，需要说明", FACT_UNCONFIRMED: "图片票的读数需要你对照原图确认",
  VISION_REQUIRED: "图片没能读出，请发原始 PDF 或手动核对", REPLACEMENT_REQUIRES_DECISION: "重开票：原票已作废且未付款",
  HISTORY_ALREADY_PAID: "原票已付款，只能更换凭证", HISTORY_UNKNOWN: "原票状态不明", PARTIAL_REFUND: "对应支付有部分退款",
  PAYMENT_STATUS_UNKNOWN: "支付状态不明", LINK_CONFLICT: "同一笔支付被两张票争用", MULTIPLE_CANDIDATES: "有多笔可能对应的支付",
  DATE_CONFLICT: "证据给出的日期不一致", SERVICE_DATE_MISSING: "定不出消费日期", OUT_OF_WINDOW: "日期不在本期可报范围",
  STAY_PERIOD_MISSING: "住宿票缺入住离店日期", CATEGORY_UNKNOWN: "报销类别需要确认", CATEGORY_CONFLICT: "报销类别需要确认",
};
const FIELD_NAMES = { invoice_no: "发票号码", issue_date: "开票日期", amount_cents: "金额（元）", amount_upper: "大写金额",
  buyer_name: "购买方", buyer_tax_id: "购买方税号", seller_name: "销售方", project: "项目", remark: "备注", order_ref: "订单号",
  merchant: "商户", amount: "金额（元）", service_date: "日期", };
let current = null;
let pollTimer = null;

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (cls) node.className = cls;
  return node;
}
function yuan(cents) { return "¥" + (cents / 100).toFixed(2); }
function say(text) { document.getElementById("message").textContent = text || ""; }

async function load() {
  const response = await fetch(api("state"), { credentials: "same-origin", cache: "no-store" });
  if (response.status === 401) { say("会话已过期，请从聊天里重新打开卡片。"); return; }
  if (response.status === 403) { say("这个页面属于另一个批次或你没有权限。"); return; }
  const state = await response.json();
  current = state;
  render(state);
}

async function post(path, body) {
  say("");
  const response = await fetch(api(path), {
    method: "POST", credentials: "same-origin", cache: "no-store",
    headers: { "Content-Type": "application/json", "X-CSRF-Token": current.csrf },
    body: JSON.stringify(Object.assign({ expected_revision: current.batch.revision }, body)),
  });
  if (response.status === 409) { say("页面已刷新到最新版本，请再看一遍再操作。"); }
  else if (!response.ok) { const detail = await response.json().catch(() => ({})); say("没有成功：" + (detail.detail || detail.error || response.status)); }
  await load();
}

function render(state) {
  const status = document.getElementById("status");
  const content = document.getElementById("content");
  content.replaceChildren();
  clearTimeout(pollTimer);
  if (!state.paired) {
    status.textContent = "还没有配对";
    const card = el("div", null, "card");
    card.append(el("div", "把下面的 6 位码发给「报销助手」，只发送你本人刚打开的页面上的码："), el("div", state.code, "code"),
                el("div", "10 分钟内有效。配对成功后这个页面会自动刷新。", "muted"));
    content.append(card);
    pollTimer = setTimeout(load, 3000);
    return;
  }
  status.textContent = `${state.user} · 批次状态：${state.batch.label} · 版本 ${state.batch.revision}`;
  if (state.report) {
    const card = el("div", null, "card");
    card.append(el("pre", state.report.text));
    content.append(card);
  }
  const applicant = state.role === "applicant";
  const pending = (state.report ? state.report.items : []).filter((item) => item.disposition === "needs_decision");
  for (const item of pending) content.append(itemCard(item, state, applicant));
  if (applicant && state.batch.state === "awaiting_confirm") content.append(confirmCard(state));
  if (state.published) content.append(publishedCard(state));
}

function itemCard(item, state, applicant) {
  const card = el("div", null, "card");
  const name = item.short_name || item.seller || item.file;
  card.append(el("strong", `${name} ${item.amount_cents != null ? yuan(item.amount_cents) : "（金额待读取）"}`));
  for (const code of item.reasons) card.append(el("div", REASONS[code] || code, "reason"));
  if (item.explanation) card.append(el("div", "Agent 说明：" + item.explanation, "note muted"));
  if (!applicant || state.batch.state !== "needs_decision") return card;
  const reasons = new Set(item.reasons);
  const visual = state.visual_checks[item.item_id];
  if (reasons.has("FACT_UNCONFIRMED") && visual) card.append(fieldForm(visual.source_id, visual.fields, "按原图确认读数",
      (fields) => post("confirm-visual", { item_id: item.item_id, corrections: fields })));
  if (reasons.has("OVER_LIMIT")) card.append(textForm("超标原因", "提交说明",
      (text) => post("decide", { item_id: item.item_id, kind: "explain_over_limit", payload: { explanation: text } })));
  if (reasons.has("REPLACEMENT_REQUIRES_DECISION")) {
    const original = (state.report.replacements[item.item_id] || [])[0];
    if (original) card.append(button(`按替换入账（原票 ${original}）`,
      () => post("decide", { item_id: item.item_id, kind: "replace_unpaid_invoice", payload: { invoice_no: original } })));
  }
  if (reasons.has("HISTORY_ALREADY_PAID")) {
    const original = (state.report.replacements[item.item_id] || [])[0];
    if (original) card.append(button("只更换凭证，不报销",
      () => post("decide", { item_id: item.item_id, kind: "receipt_only", payload: { replaces_invoice_no: original } })));
  }
  if (reasons.has("EVIDENCE_MISSING")) {
    for (const shot of state.screenshots) card.append(fieldForm(shot.source_id, shot.fields, `核对截图「${shot.file}」的读数`,
      (fields) => post("confirm-screenshot", { source_id: shot.source_id, corrections: fields })));
  }
  if (["EVIDENCE_MISSING", "DATE_CONFLICT", "SERVICE_DATE_MISSING"].some((code) => reasons.has(code))) card.append(manualForm(item));
  if (reasons.has("MULTIPLE_CANDIDATES") || reasons.has("LINK_CONFLICT")) {
    const link = (state.links || []).find((row) => row.item_id === item.item_id);
    for (const candidate of (link ? link.payment_candidates : [])) card.append(button(`选这笔支付：${candidate}`,
      () => post("decide", { item_id: item.item_id, kind: "choose_evidence", payload: { evidence_id: candidate } })));
  }
  card.append(textForm("不报这张票的原因", "不报这张票", (text) => post("decide", { item_id: item.item_id, kind: "reject", payload: { reason: text } }), true));
  return card;
}

function fieldForm(sourceId, fields, title, submit) {
  const form = el("div");
  form.append(el("div", title, "muted"));
  const img = el("img", null, "original");
  img.alt = "原件";
  img.src = api("source/" + encodeURIComponent(sourceId));
  form.append(img);
  const inputs = {};
  for (const [name, value] of Object.entries(fields)) {
    if (name === "amount_cents" && typeof value === "number") { inputs[name] = input(form, FIELD_NAMES[name], (value / 100).toFixed(2)); continue; }
    if (name === "amount_cents") { inputs.amount = input(form, FIELD_NAMES.amount, (value / 100).toFixed(2)); continue; }
    inputs[name] = input(form, FIELD_NAMES[name] || name, value);
  }
  form.append(button("确认（与原件一致）", () => {
    const changed = {};
    for (const [name, node] of Object.entries(inputs)) {
      const original = name === "amount_cents" || name === "amount" ? ((fields.amount_cents ?? fields.amount) / 100).toFixed(2) : String(fields[name] ?? "");
      if (node.value !== original) changed[name] = node.value;
    }
    submit(changed);
  }));
  return form;
}

function input(parent, labelText, value) {
  parent.append(el("label", labelText));
  const node = el("input");
  node.value = value == null ? "" : String(value);
  parent.append(node);
  return node;
}

function textForm(labelText, action, submit, secondary) {
  const form = el("div");
  form.append(el("label", labelText));
  const area = el("textarea");
  area.maxLength = 1000;
  form.append(area);
  const b = button(action, () => { if (area.value.trim()) submit(area.value.trim()); else say("请先填写"); });
  if (secondary) b.className = "secondary";
  form.append(b);
  return form;
}

function manualForm(item) {
  const form = el("div");
  const date = input(form, "实际消费日期（YYYY-MM-DD）", item.service_date || "");
  const note = input(form, "依据说明", "");
  form.append(button("按手工证据入账", () => post("decide", { item_id: item.item_id, kind: "manual_evidence",
    payload: { service_date: date.value.trim(), note: note.value.trim() || "申请人手工补充" } })));
  return form;
}

function button(text, onClick) {
  const b = el("button", text);
  b.type = "button";
  b.addEventListener("click", onClick);
  return b;
}

function confirmCard(state) {
  const card = el("div", null, "card");
  card.append(el("strong", "全部判断完成"), el("div", "确认后按当前版本生成报销包并终审；生成后不可修改，只能新开版本。", "muted"));
  const names = (state.report.items || []).filter((item) => item.disposition === "accepted").map((item) => item.short_name).filter(Boolean);
  if (names.length) card.append(el("div", "文件名里的简称：" + Array.from(new Set(names)).join("、"), "muted"));
  card.append(button("确认生成", () => post("confirm", {})));
  const back = button("暂不生成", () => post("decline", {}));
  back.className = "secondary";
  card.append(back);
  return card;
}

function publishedCard(state) {
  const card = el("div", null, "card");
  card.append(el("strong", "报销包已生成"));
  for (const name of state.published) {
    const a = el("a", name);
    a.href = api("files/" + encodeURIComponent(name));
    a.style.display = "block";
    card.append(a);
  }
  return card;
}

load();
</script>
</body>
</html>
